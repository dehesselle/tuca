[project]
name = "cio"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "urlpath>=2.0.0",
]

[project.scripts]
cio = "cio:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/cio/_version.py"
